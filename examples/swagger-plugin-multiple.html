<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multiple OpenAPI documents · Swagger UI plugin</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.33.0/swagger-ui.css">
  <link rel="stylesheet" href="../dist/plugin.css">
</head>
<body>
  <div id="search-controls"></div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.33.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.33.0/swagger-ui-standalone-preset.js"></script>
  <script src="../dist/plugin.js"></script>
  <script>
    const extension = SwaggerSearchAI.createSwaggerSearch({
      element: document.getElementById('search-controls'),
      title: 'Example API catalog',
      showSpecificationName: true
    });
    const ui = SwaggerUIBundle({
      urls: [
        { name: 'Library', url: '../fixtures/library.openapi.json' },
        { name: 'Pets', url: '../fixtures/pets.openapi.json' }
      ],
      'urls.primaryName': 'Library',
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: 'StandaloneLayout',
      plugins: [extension.plugin],
      validatorUrl: null,
      onComplete: () => extension.attach(ui)
    });
  </script>
</body>
</html>
